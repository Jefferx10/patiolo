<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carta — Patiolo</title>
<meta name="description" content="Carta digital de los locales de Patiolo: patio de comidas, bar y experiencias.">
<meta name="theme-color" content="#5F1121">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-60 -40 796 866'%3E%3Crect x='-60' y='-40' width='796' height='866' rx='160' fill='%235F1121'/%3E%3Cpath fill='%23FFF8E1' fill-rule='evenodd' d='M293 0 L292 11 L299 24 L308 69 L307 104 L289 187 L259 249 L220 297 L195 321 L180 325 L174 315 L167 260 L158 240 L146 222 L130 206 L121 206 L110 260 L98 285 L34 377 L13 418 L1 465 L0 528 L11 573 L22 601 L42 636 L60 660 L88 688 L119 709 L145 721 L170 720 L199 710 L238 690 L266 671 L283 654 L296 651 L328 629 L406 565 L468 496 L479 433 L489 409 L498 396 L522 375 L540 364 L585 346 L593 348 L598 356 L595 391 L588 418 L578 440 L547 471 L531 481 L506 492 L482 498 L469 523 L430 577 L334 676 L271 721 L210 759 L213 766 L221 769 L292 781 L338 785 L387 783 L445 771 L500 749 L536 729 L575 701 L606 669 L646 606 L657 583 L667 551 L675 496 L669 424 L658 377 L638 326 L588 239 L583 235 L576 236 L569 254 L551 284 L525 309 L514 311 L510 305 L507 259 L496 217 L477 172 L445 121 L416 86 L384 56 L328 15Z M344 690 L346 683 L376 662 L416 641 L509 641 L542 647 L555 655 L551 663 L493 702 L460 712 L423 713 L398 710 L362 701Z M635 526 L634 530 L599 563 L567 582 L537 591 L512 594 L449 596 L443 594 L439 588 L485 543 L535 513 L566 507 L582 507 L618 513Z M265 458 L277 464 L310 511 L320 541 L318 581 L309 603 L279 654 L267 647 L251 624 L241 604 L230 562 L231 529 L240 498Z M399 379 L417 402 L429 431 L432 454 L431 488 L420 521 L408 539 L386 560 L375 566 L366 560 L359 544 L350 501 L350 465 L360 430 L368 414 L390 382Z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--burdeos:#5F1121;--crema:#FFF8E1;--carbon:#212121;--dorado:#C5A07F;--noche:#1A1818;--texto-suave:#D9CDB8;--gutter:64px}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:150px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--noche);color:var(--crema);font-family:'Montserrat',system-ui,sans-serif;font-size:16px;line-height:1.6}
img{display:block;max-width:100%}
a{color:var(--dorado)}
:focus-visible{outline:2px solid var(--dorado);outline-offset:3px}
h1,h2,h3{font-family:'Marcellus',serif;font-weight:400;margin:0;line-height:1.05}
p{margin:0}
.wrap{padding-inline:var(--gutter)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.top{background:var(--burdeos);padding-block:20px 28px}
.top-bar{display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--crema)}
.brand-name{font-weight:800;font-size:20px;letter-spacing:1px;line-height:1}
.volver{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid var(--dorado);border-radius:4px;color:var(--crema);font-size:14px;font-weight:600;text-decoration:none}
.volver:hover{background:var(--crema);color:var(--burdeos)}
.titulo{margin-top:26px;display:flex;flex-direction:column;gap:10px}
.tipo{font-size:12px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--dorado)}
.titulo h1{font-size:clamp(40px,6vw,72px)}
.titulo p{max-width:620px;color:#F0E3D2;font-size:17px}

.tabs{position:sticky;top:0;z-index:5;background:rgba(26,24,24,.97);border-bottom:1px solid rgba(197,160,127,.35);overflow-x:auto;-webkit-overflow-scrolling:touch}
.tabs-inner{display:flex;gap:10px;padding-block:14px;white-space:nowrap}
.tab{display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border:1px solid rgba(197,160,127,.5);border-radius:999px;color:var(--crema);font-size:14px;font-weight:600;text-decoration:none}
.tab:hover,.tab.activa{background:var(--dorado);color:var(--carbon);border-color:var(--dorado)}

main{padding-block:40px 80px}
.cat{margin-bottom:56px}
.cat h2{font-size:clamp(28px,3.4vw,40px);color:var(--crema);margin-bottom:6px}
.cat .linea{height:1px;background:rgba(197,160,127,.4);margin-bottom:26px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:20px}
.item{display:flex;gap:18px;background:var(--carbon);border:1px solid rgba(197,160,127,.3);border-radius:8px;padding:16px;position:relative}
.item.agotado{opacity:.55}
.foto{position:relative;flex-shrink:0;width:120px;height:120px;border-radius:6px;overflow:hidden;background:#2A2626;display:flex;align-items:center;justify-content:center}
.foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.foto .llama{color:var(--dorado);opacity:.4}
.item-txt{display:flex;flex-direction:column;gap:6px;min-width:0}
.item h3{font-size:22px;line-height:1.15}
.item p{font-size:14px;color:var(--texto-suave);line-height:1.5}
.precio{margin-top:auto;padding-top:8px;display:flex;align-items:baseline;gap:10px;font-family:'Marcellus',serif;font-size:22px;color:var(--crema)}
.antes{font-family:'Montserrat',sans-serif;font-size:14px;color:var(--texto-suave);text-decoration:line-through}
.badge{position:absolute;top:12px;right:12px;padding:4px 10px;border-radius:999px;background:var(--dorado);color:var(--carbon);font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase}
.badge.gris{background:rgba(255,248,225,.22);color:var(--crema)}
.item:has(.badge) h3{padding-right:90px}

.pie{background:var(--burdeos);padding-block:40px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.pie .nota{font-size:13px;color:#E6D5BF}
.otros{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:6px}
.otros a{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border:1px solid rgba(255,248,225,.5);border-radius:999px;color:var(--crema);font-size:13px;font-weight:600;text-decoration:none}
.otros a:hover{background:var(--crema);color:var(--burdeos)}
.aviso{max-width:640px;margin:80px auto;text-align:center;display:flex;flex-direction:column;gap:18px;align-items:center}

@media (max-width:900px){
  :root{--gutter:16px}
  html{scroll-padding-top:130px}
  .top{padding-block:14px 22px}
  .titulo{margin-top:18px}
  .titulo p{font-size:15px}
  .items{grid-template-columns:1fr;gap:12px}
  .item{gap:14px;padding:12px}
  .foto{width:96px;height:96px}
  .item h3{font-size:18px}
  .item p{font-size:13px}
  .precio{font-size:19px}
  .cat{margin-bottom:40px}
  .volver span{display:none}
  .volver{padding:0 12px}
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="top-bar">
      <a class="brand" href="index.html" aria-label="Patiolo, inicio">
        <svg width="30" height="35" viewBox="0 0 676 786" aria-hidden="true"><path fill="#FFF8E1" fill-rule="evenodd" d="M293 0 L292 11 L299 24 L308 69 L307 104 L289 187 L259 249 L220 297 L195 321 L180 325 L174 315 L167 260 L158 240 L146 222 L130 206 L121 206 L110 260 L98 285 L34 377 L13 418 L1 465 L0 528 L11 573 L22 601 L42 636 L60 660 L88 688 L119 709 L145 721 L170 720 L199 710 L238 690 L266 671 L283 654 L296 651 L328 629 L406 565 L468 496 L479 433 L489 409 L498 396 L522 375 L540 364 L585 346 L593 348 L598 356 L595 391 L588 418 L578 440 L547 471 L531 481 L506 492 L482 498 L469 523 L430 577 L334 676 L271 721 L210 759 L213 766 L221 769 L292 781 L338 785 L387 783 L445 771 L500 749 L536 729 L575 701 L606 669 L646 606 L657 583 L667 551 L675 496 L669 424 L658 377 L638 326 L588 239 L583 235 L576 236 L569 254 L551 284 L525 309 L514 311 L510 305 L507 259 L496 217 L477 172 L445 121 L416 86 L384 56 L328 15Z M344 690 L346 683 L376 662 L416 641 L509 641 L542 647 L555 655 L551 663 L493 702 L460 712 L423 713 L398 710 L362 701Z M635 526 L634 530 L599 563 L567 582 L537 591 L512 594 L449 596 L443 594 L439 588 L485 543 L535 513 L566 507 L582 507 L618 513Z M265 458 L277 464 L310 511 L320 541 L318 581 L309 603 L279 654 L267 647 L251 624 L241 604 L230 562 L231 529 L240 498Z M399 379 L417 402 L429 431 L432 454 L431 488 L420 521 L408 539 L386 560 L375 566 L366 560 L359 544 L350 501 L350 465 L360 430 L368 414 L390 382Z"/></svg>
        <span class="brand-name">PATIOLO</span>
      </a>
      <a class="volver" href="index.html#cocinas">← <span>Volver al patio</span></a>
    </div>
    <div class="titulo">
      <span class="tipo" id="tipo"></span>
      <h1 id="nombre">Carta</h1>
      <p id="descripcion"></p>
    </div>
  </div>
</header>

<nav class="tabs" id="tabs" aria-label="Categorías de la carta"><div class="wrap tabs-inner" id="tabs-inner"></div></nav>

<main class="wrap" id="contenido"></main>

<footer class="pie">
  <svg width="40" height="47" viewBox="0 0 676 786" aria-hidden="true"><path fill="#FFF8E1" fill-rule="evenodd" d="M293 0 L292 11 L299 24 L308 69 L307 104 L289 187 L259 249 L220 297 L195 321 L180 325 L174 315 L167 260 L158 240 L146 222 L130 206 L121 206 L110 260 L98 285 L34 377 L13 418 L1 465 L0 528 L11 573 L22 601 L42 636 L60 660 L88 688 L119 709 L145 721 L170 720 L199 710 L238 690 L266 671 L283 654 L296 651 L328 629 L406 565 L468 496 L479 433 L489 409 L498 396 L522 375 L540 364 L585 346 L593 348 L598 356 L595 391 L588 418 L578 440 L547 471 L531 481 L506 492 L482 498 L469 523 L430 577 L334 676 L271 721 L210 759 L213 766 L221 769 L292 781 L338 785 L387 783 L445 771 L500 749 L536 729 L575 701 L606 669 L646 606 L657 583 L667 551 L675 496 L669 424 L658 377 L638 326 L588 239 L583 235 L576 236 L569 254 L551 284 L525 309 L514 311 L510 305 L507 259 L496 217 L477 172 L445 121 L416 86 L384 56 L328 15Z M344 690 L346 683 L376 662 L416 641 L509 641 L542 647 L555 655 L551 663 L493 702 L460 712 L423 713 L398 710 L362 701Z M635 526 L634 530 L599 563 L567 582 L537 591 L512 594 L449 596 L443 594 L439 588 L485 543 L535 513 L566 507 L582 507 L618 513Z M265 458 L277 464 L310 511 L320 541 L318 581 L309 603 L279 654 L267 647 L251 624 L241 604 L230 562 L231 529 L240 498Z M399 379 L417 402 L429 431 L432 454 L431 488 L420 521 L408 539 L386 560 L375 566 L366 560 L359 544 L350 501 L350 465 L360 430 L368 414 L390 382Z"/></svg>
  <p class="nota">Precios en pesos chilenos, IVA incluido. Pueden cambiar sin previo aviso.</p>
  <div class="otros" id="otros"></div>
</footer>

<script src="data/cartas.js"></script>
<script>
  var CARTAS = window.CARTAS || {};
  var slug = new URLSearchParams(location.search).get('local');
  var local = CARTAS[slug];
  var $ = function(id){ return document.getElementById(id); };

  function precio(n){ return '$' + Number(n).toLocaleString('es-CL'); }
  function texto(t){ var d = document.createElement('div'); d.textContent = t == null ? '' : t; return d.innerHTML; }
  function id(t){ return 'cat-' + t.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, ''); }

  function listaOtros(){
    return Object.keys(CARTAS).filter(function(k){ return k !== slug; }).map(function(k){
      return '<a href="carta.html?local=' + k + '">' + texto(CARTAS[k].nombre) + '</a>';
    }).join('');
  }

  if (!local) {
    document.title = 'Carta — Patiolo';
    $('contenido').innerHTML = '<div class="aviso"><h2>Elige un local</h2>' +
      '<p>Estas son las cartas disponibles en el patio.</p>' +
      '<div class="otros">' + Object.keys(CARTAS).map(function(k){
        return '<a href="carta.html?local=' + k + '">' + texto(CARTAS[k].nombre) + '</a>';
      }).join('') + '</div></div>';
    $('tabs').remove();
  } else {
    document.title = 'Carta de ' + local.nombre + ' — Patiolo';
    $('tipo').textContent = local.tipo || '';
    $('nombre').textContent = local.nombre;
    $('descripcion').textContent = local.descripcion || '';

    $('tabs-inner').innerHTML = local.categorias.map(function(c, i){
      return '<a class="tab' + (i === 0 ? ' activa' : '') + '" href="#' + id(c.nombre) + '">' + texto(c.nombre) + '</a>';
    }).join('');

    $('contenido').innerHTML = local.categorias.map(function(c){
      var items = c.items.map(function(it){
        var badge = it.agotado ? '<span class="badge gris">Agotado</span>'
                  : it.destacado ? '<span class="badge">Favorito</span>' : '';
        var foto = '<div class="foto"><svg class="llama" width="34" height="40" viewBox="0 0 676 786" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M293 0 L292 11 L299 24 L308 69 L307 104 L289 187 L259 249 L220 297 L195 321 L180 325 L174 315 L167 260 L158 240 L146 222 L130 206 L121 206 L110 260 L98 285 L34 377 L13 418 L1 465 L0 528 L11 573 L22 601 L42 636 L60 660 L88 688 L119 709 L145 721 L170 720 L199 710 L238 690 L266 671 L283 654 L296 651 L328 629 L406 565 L468 496 L479 433 L489 409 L498 396 L522 375 L540 364 L585 346 L593 348 L598 356 L595 391 L588 418 L578 440 L547 471 L531 481 L506 492 L482 498 L469 523 L430 577 L334 676 L271 721 L210 759 L213 766 L221 769 L292 781 L338 785 L387 783 L445 771 L500 749 L536 729 L575 701 L606 669 L646 606 L657 583 L667 551 L675 496 L669 424 L658 377 L638 326 L588 239 L583 235 L576 236 L569 254 L551 284 L525 309 L514 311 L510 305 L507 259 L496 217 L477 172 L445 121 L416 86 L384 56 L328 15Z M344 690 L346 683 L376 662 L416 641 L509 641 L542 647 L555 655 L551 663 L493 702 L460 712 L423 713 L398 710 L362 701Z M635 526 L634 530 L599 563 L567 582 L537 591 L512 594 L449 596 L443 594 L439 588 L485 543 L535 513 L566 507 L582 507 L618 513Z M265 458 L277 464 L310 511 L320 541 L318 581 L309 603 L279 654 L267 647 L251 624 L241 604 L230 562 L231 529 L240 498Z M399 379 L417 402 L429 431 L432 454 L431 488 L420 521 L408 539 L386 560 L375 566 L366 560 L359 544 L350 501 L350 465 L360 430 L368 414 L390 382Z"/></svg>' +
          (it.foto ? '<img src="img/carta/' + texto(it.foto) + '" alt="' + texto(it.nombre) + '" loading="lazy" onerror="this.remove()">' : '') + '</div>';
        return '<article class="item' + (it.agotado ? ' agotado' : '') + '">' + badge + foto +
          '<div class="item-txt"><h3>' + texto(it.nombre) + '</h3>' +
          (it.desc ? '<p>' + texto(it.desc) + '</p>' : '') +
          '<div class="precio">' + precio(it.precio) +
          (it.antes ? '<span class="antes">' + precio(it.antes) + '</span>' : '') +
          '</div></div></article>';
      }).join('');
      return '<section class="cat" id="' + id(c.nombre) + '"><h2>' + texto(c.nombre) + '</h2><div class="linea"></div><div class="items">' + items + '</div></section>';
    }).join('');

    $('otros').innerHTML = listaOtros();

    // Marca la categoría visible en las pestañas
    var tabs = Array.prototype.slice.call(document.querySelectorAll('.tab'));
    var secciones = Array.prototype.slice.call(document.querySelectorAll('.cat'));
    if ('IntersectionObserver' in window) {
      var obs = new IntersectionObserver(function(entradas){
        entradas.forEach(function(e){
          if (!e.isIntersecting) return;
          tabs.forEach(function(t){ t.classList.toggle('activa', t.getAttribute('href') === '#' + e.target.id); });
        });
      }, { rootMargin: '-140px 0px -70% 0px' });
      secciones.forEach(function(s){ obs.observe(s); });
    }
  }
</script>
</body>
</html>
