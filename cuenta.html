<style>
:root{--burdeos:#5F1121;--crema:#FFF8E1;--carbon:#212121;--dorado:#C5A07F;--noche:#1A1818;--texto-suave:#D9CDB8;--ok:#7FC79A;--gutter:64px}
*{box-sizing:border-box}
body{margin:0;background:var(--noche);color:var(--crema);font-family:'Montserrat',system-ui,sans-serif;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--dorado)}
:focus-visible{outline:2px solid var(--dorado);outline-offset:3px}
h1,h2,h3{font-family:'Marcellus',serif;font-weight:400;margin:0;line-height:1.05}
p{margin:0}
.wrap{padding-inline:var(--gutter);max-width:1280px;margin-inline:auto}
.label{font-size:12px;font-weight:600;letter-spacing:1.4px;color:var(--dorado);text-transform:uppercase}
.suave{color:var(--texto-suave)}
.chico{font-size:13px}
.top{background:var(--burdeos);padding-block:20px}
.top-bar{display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--crema)}
.brand-name{font-weight:800;font-size:20px;letter-spacing:1px;line-height:1}
.volver{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid var(--dorado);border-radius:4px;color:var(--crema);font-size:14px;font-weight:600;text-decoration:none}
.volver:hover{background:var(--crema);color:var(--burdeos)}
main{padding-block:44px 80px;min-height:60vh}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 24px;border-radius:4px;font:inherit;font-weight:600;font-size:15px;text-decoration:none;cursor:pointer;border:1px solid transparent}
.btn:disabled{opacity:.6;cursor:default}
.btn-primary{background:var(--burdeos);color:var(--crema);border-color:var(--dorado)}
.btn-primary:hover:not(:disabled){background:#7A1A2D}
.btn-ghost{background:transparent;color:var(--crema);border-color:rgba(255,248,225,.5)}
.btn-ghost:hover:not(:disabled){background:var(--crema);color:var(--carbon)}
.btn-google{background:#fff;color:#1f1f1f;border-color:#dadce0}
.btn-link{background:none;border:0;color:var(--dorado);font:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:6px 0;align-self:flex-start}
.campo{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--texto-suave)}
.campo input{min-height:48px;padding:0 14px;border-radius:4px;border:1px solid rgba(197,160,127,.5);background:#262222;color:var(--crema);font:inherit;font-size:16px}
.campo input:disabled{opacity:.6}
.error{color:#FFB4A9;font-size:14px}
.aviso{max-width:560px;margin:60px auto;text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center}
.fila{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.caja{background:var(--carbon);border:1px solid rgba(197,160,127,.3);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:14px}
.caja.destacar{border-color:var(--dorado);box-shadow:0 0 0 1px var(--dorado) inset}
.caja-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.caja h2{font-size:26px}
/* Login */
.login{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:start}
.login-txt{display:flex;flex-direction:column;gap:16px;padding-top:12px}
.login-txt h1{font-size:clamp(44px,6vw,76px)}
.login-txt p{font-size:18px;color:#F0E3D2;max-width:520px}
.beneficios{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:10px}
.beneficios li{padding-left:28px;position:relative}
.beneficios li::before{content:"";position:absolute;left:0;top:.45em;width:14px;height:14px;border-radius:50%;background:var(--dorado)}
.login-caja h2{font-size:24px}
/* Cuenta */
.saludo{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.saludo h1{font-size:clamp(40px,5.5vw,64px);margin-top:6px}
.grilla{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.sellos{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:8px}
.sello{aspect-ratio:1;border-radius:50%;border:1.5px dashed rgba(197,160,127,.6);display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--texto-suave);max-width:56px}
.sello svg{width:52%;height:52%}
.sello.lleno{background:var(--burdeos);border:1.5px solid var(--dorado);color:var(--crema)}
.sello.premio{border-style:solid;border-color:var(--dorado);font-size:18px}
.cupones{display:flex;flex-direction:column;gap:10px}
.cupon{display:flex;justify-content:space-between;align-items:center;gap:14px;background:#2A2422;border:1px dashed var(--dorado);border-radius:8px;padding:14px 16px}
.cupon>div:first-child{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:14px}
.cupon b{font-size:16px}
.codigo{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:18px;font-weight:700;letter-spacing:2px;color:var(--carbon);background:var(--dorado);padding:8px 12px;border-radius:6px;white-space:nowrap}
.misiones{display:flex;flex-direction:column;gap:16px}
.mision{display:flex;flex-direction:column;gap:6px}
.mision p.suave{font-size:14px}
.mision-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.mision-h span{font-size:14px;color:var(--texto-suave);white-space:nowrap}
.barra{height:10px;border-radius:999px;background:#3A3230;overflow:hidden}
.barra span{display:block;height:100%;background:linear-gradient(90deg,var(--burdeos),var(--dorado));border-radius:999px}
.mision.lista .mision-h span{color:var(--ok);font-weight:700}
.pedidos{display:flex;flex-direction:column}
.pedido{border-bottom:1px solid rgba(197,160,127,.25)}
.pedido:last-child{border-bottom:0}
.pedido summary{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;cursor:pointer;list-style:none}
.pedido summary::-webkit-details-marker{display:none}
.pedido summary::after{content:"+";color:var(--dorado);font-size:20px;margin-left:8px}
.pedido[open] summary::after{content:"−"}
.pedido summary>span:first-child{display:flex;flex-direction:column;line-height:1.35;font-size:14px}
.monto{font-family:'Marcellus',serif;font-size:20px;margin-left:auto}
.pedido-b{display:flex;flex-direction:column;gap:4px;padding:0 0 14px;font-size:14px}
.linea{display:flex;justify-content:space-between;gap:12px}
.linea.desc{color:var(--ok)}
.linea.total{border-top:1px solid rgba(197,160,127,.25);padding-top:6px;margin-top:4px;font-weight:700}
.form-datos{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-datos .acciones{grid-column:1/-1;display:flex;align-items:center;gap:14px}
#datos-msg{font-size:14px;color:var(--ok)}
#datos-msg.error{color:#FFB4A9}
.pie{background:var(--burdeos);padding-block:30px;text-align:center;font-size:13px;color:#E6D5BF}
@media (max-width:900px){
  :root{--gutter:16px}
  main{padding-block:28px 60px}
  .login{grid-template-columns:1fr;gap:24px}
  .login-txt p{font-size:16px}
  .grilla{grid-template-columns:1fr}
  .caja{padding:16px}
  .form-datos{grid-template-columns:1fr}
  .volver span{display:none}
  .volver{padding:0 12px}
  .sellos{gap:5px}
  .cupon{flex-direction:column;align-items:flex-start}
}
</style>
</head>
